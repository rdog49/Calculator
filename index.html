<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Калькулятор</title>
</head>

<body class="bgc">
    <!-- основное тело -->

    <div class="calculator">
        <!-- вывод -->
        <div class="display">
            <div class="previosNumber"></div>
            <div class="currentNumber"></div>
        </div>
        <div class="numbers">
            <!-- кнопки-->
            <button class="number number-wide" id="AC">AС</button>
            <button class="number" id="+/-">+/-</button>
            <button class="number" id="DEL">DEL</button>
            <button class="number number-high" id="nˣ">nˣ</button>
            <button class="number" id="1">1</button>
            <button class="number" id="2">2</button>
            <button class="number" id="3">3</button>
            <button class="number" id="/">/</button>
            <button class="number" id="4">4</button>
            <button class="number" id="5">5</button>
            <button class="number" id="6">6</button>
            <button class="number" id="*">*</button>
            <button class="number number-high" id="²√">²√</button>
            <button class="number" id="7">7</button>
            <button class="number" id="8">8</button>
            <button class="number" id="9">9</button>
            <button class="number" id="+">+</button>
            <button class="number" id=".">.</button>
            <button class="number number-wide" id="0">0</button>
            <button class="number" id="-">-</button>
            <button class="number" id="=">=</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>


</html>
