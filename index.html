<!DOCTYPE HTML>
<html>

<head>
    <link rel="stylesheet" href="style.css">

<body class="bgc">
    <!-- основное тело -->
    <div class="wrapper__center">
        <div class="calculator">
            <div class="display">0</div>
            <div class="numbers">
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="number number-cool number-yell">AС</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="number number-yell">-</button>
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="number number-yell">/</button>
                <button class="number number-gray">²√</button>
                <button class="number">0</button>
                <button class="number number-gray">x²</button>
                <button class="number number-yell">+</button>
                <button class="number number-yell">*</button>
                <button class="number number-yell">.</button>
                <button class="number number-yell-eq">+/-</button>
                <button class="number number-yell-eq">=</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</head>

</html>
